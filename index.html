<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2b1e1a" />
  <title>45 Years of Perfection</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="hero">
    <img
      class="hero__photo"
      src="assets/2C460242-44AF-4E7C-AE8B-13B12054777C.jpeg"      
      alt="A photograph of Dad"
    />
    <div class="hero__overlay"></div>

    <div class="hero__content">
      <p class="eyebrow">A birthday made of memories</p>
      <h1>45 Years<br /><span>of Perfection</span></h1>
      <p class="hero__subtitle">A little piece of every life you made brighter.</p>

      <button class="gift-button" id="openBookButton" type="button">
        <span class="gift-button__sparkle">✦</span>
        Receive a Memory
        <span class="gift-button__sparkle">✦</span>
      </button>
    </div>

    <p class="scroll-note">Made with love, by all of us</p>
  </main>

  <section class="modal" id="memoryModal" aria-hidden="true">
    <div class="modal__backdrop" data-close-modal></div>

    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
      <button class="close-button" type="button" aria-label="Close memory book" data-close-modal>
        ×
      </button>

      <div class="book-heading">
        <div>
          <p class="book-heading__small">A collection for Dad</p>
          <h2 id="bookTitle">Our Memory Book</h2>
        </div>
        <p class="page-counter" id="pageCounter">Pages 1–2 of 8</p>
      </div>

      <div class="book-stage">
        <div class="book" id="book">
          <div class="book__spine"></div>

          <article class="book-page book-page--left" id="leftPage"></article>
          <article class="book-page book-page--right" id="rightPage"></article>

          <div class="turning-sheet" id="turningSheet" aria-hidden="true">
            <article class="turning-sheet__face turning-sheet__front" id="turnFront"></article>
            <article class="turning-sheet__face turning-sheet__back" id="turnBack"></article>
          </div>
        </div>
      </div>

      <div class="book-controls">
        <button class="nav-button" id="previousButton" type="button">← Previous</button>
        <p>Tip: use the arrow keys too</p>
        <button class="nav-button nav-button--primary" id="nextButton" type="button">Next →</button>
      </div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
